<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Rhythm Remake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="960" height="640"></canvas>
      <div id="textbox" hidden></div>
      <div id="caption" hidden></div>
      <div id="skip" hidden>Enter — skip practice</div>
      <div id="menu" class="panel">
        <h1>Karate Man</h1>
        <p class="sub">GBA 1:1 engine · Diamond* edition</p>
        <p id="skin-status" class="sub" hidden></p>
        <input id="song-search" type="search" placeholder="Search songs…" autocomplete="off" spellcheck="false" />
        <div id="song-list"></div>
        <div class="row">
          <button class="mini" id="import-song">+ Import song</button>
          <button class="mini" id="calibrate">Calibrate <span id="offset-label"></span></button>
          <label><input type="checkbox" id="opt-debug" /> Timing</label>
        </div>
        <input id="import-file" type="file" accept="audio/*,.json" multiple hidden />
        <p class="keys">Pick a song, then a game · A = Space / J / Z / tap · Enter = skip · Esc = back</p>
      </div>
      <div id="calib" class="panel" hidden>
        <h2>Tap A on every click</h2>
        <p id="calib-status">Starting…</p>
      </div>
      <div id="import" class="panel" hidden>
        <h2 id="imp-title">Importing…</h2>
        <p id="imp-status" class="sub"></p>
        <div id="imp-controls" hidden>
          <div class="row">
            <span>BPM <b id="imp-bpm"></b></span>
            <button class="mini" data-bpm="0.5">÷2</button>
            <button class="mini" data-bpm="2">×2</button>
            <span>Offset <b id="imp-offset"></b></span>
            <button class="mini" data-nudge="-10">−10ms</button>
            <button class="mini" data-nudge="10">+10ms</button>
          </div>
          <div class="row" id="imp-diff">
            <label><input type="radio" name="diff" value="easy" /> Easy</label>
            <label><input type="radio" name="diff" value="normal" checked /> Normal</label>
            <label><input type="radio" name="diff" value="hard" /> Hard</label>
          </div>
          <p id="imp-summary" class="sub"></p>
        </div>
        <div id="song-games"></div>
        <div class="row">
          <button class="mini" id="imp-save" hidden>Save chart</button>
          <button class="mini" id="imp-back">Back</button>
        </div>
      </div>
      <div id="drop-hint" class="panel" hidden>Drop an MP3 / WAV / M4A (and optionally its chart .json)</div>
      <div id="results" class="panel" hidden>
        <h2 id="res-header"></h2>
        <div id="res-rank"></div>
        <ul id="res-comments"></ul>
        <p id="res-score"></p>
        <button id="res-again" class="primary">Again</button>
        <button id="res-menu">Menu</button>
      </div>
      <div id="loading" class="panel">Loading…</div>
    </div>
    <pre id="debug" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
